[package]
name = "orcrustrator"
version = "0.1.0"
edition = "2024"
authors = ["Orcrustrator Contributors"]
description = "A pure, high-performance API aggregator and relational orchestrator with multi-auth, schema inspection, and OOP data modeling."
license = "MIT OR Apache-2.0"
repository = "https://github.com/orcrustrator/orcrustrator"
keywords = ["api", "aggregator", "orchestrator", "serde", "client"]
categories = ["web-programming::http-client", "network-programming"]

[features]
default = ["xml", "oauth"]
full = ["cli", "xml", "oauth"]
cli = ["dep:clap"]
xml = ["dep:quick-xml"]
oauth = ["dep:oauth1"]

[dependencies]
# Core lightweight dependencies
tokio = { version = "1", features = ["sync", "macros", "rt-multi-thread", "time"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
url = "2.5"
async-trait = "0.1"
futures = "0.3"

# Optional feature dependencies
clap = { version = "4.5", features = ["derive"], optional = true }
quick-xml = { version = "0.37", features = ["serialize"], optional = true }
oauth1 = { version = "1.0", optional = true }

[[bin]]
name = "orcrustrator"
path = "src/bin/main.rs"
required-features = ["cli"]

[lib]
name = "orcrustrator"
path = "src/lib.rs"
