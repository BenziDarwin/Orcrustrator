[package]
name = "orcrustrator"
version = "0.1.2"
edition = "2024"
authors = ["Orcrustrator Contributors"]
description = "A pure, high-performance API aggregator and relational orchestrator with multi-auth, schema inspection, and OOP data modeling."
license = "MIT OR Apache-2.0"
repository = "https://github.com/BenziDarwin/Orcrustrator"
keywords = ["api", "aggregator", "orchestrator", "serde", "client"]
categories = ["web-programming::http-client", "network-programming"]
exclude = [
    "ui/**",
    ".github/**",
]

[features]
default = ["xml", "oauth", "events", "compiler"]
full = ["cli", "xml", "oauth", "events", "compiler"]
cli = ["dep:clap", "compiler"]
compiler = ["dep:syn", "dep:quote", "dep:proc-macro2", "dep:toml"]
events = ["dep:rmp-serde"]
xml = ["dep:quick-xml"]
oauth = ["dep:oauth1"]

[dependencies]
# Core lightweight dependencies
tokio = { version = "1", features = ["sync", "macros", "rt-multi-thread", "time"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
url = "2.5"
async-trait = "0.1"
futures = "0.3"
uuid = { version = "1.10", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
tempfile = "3.12"

# Optional feature dependencies
clap = { version = "4.5", features = ["derive"], optional = true }
quick-xml = { version = "0.37", features = ["serialize"], optional = true }
oauth1 = { version = "1.0", optional = true }
syn = { version = "2.0", features = ["full", "parsing", "visit", "extra-traits"], optional = true }
quote = { version = "1.0", optional = true }
proc-macro2 = { version = "1.0", optional = true }
toml = { version = "0.8", optional = true }
rmp-serde = { version = "1.3", optional = true }

[[bin]]
name = "orcrustrator"
path = "src/bin/main.rs"
required-features = ["cli"]

[lib]
name = "orcrustrator"
path = "src/lib.rs"
